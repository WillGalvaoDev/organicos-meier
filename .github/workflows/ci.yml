name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: organicos
          POSTGRES_PASSWORD: organicos
          POSTGRES_DB: organicos
          TZ: UTC
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U organicos -d organicos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://organicos:organicos@localhost:5433/organicos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependências (lockfile travado)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        run: uv run pytest
