[project]
name = "organicos-meier"
version = "0.0.0"
description = "Plataforma de compras coletivas Orgânicos Méier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "django-allauth[mfa,socialaccount]>=65",
    "django-environ>=0.12",
    "procrastinate[django]>=3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<6",
    "factory-boy>=3.3",
    "hypothesis>=6",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "time-machine>=2.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "acceptance: cenário de aceitação da especificação funcional (§16)",
    "tecnico: teste técnico da infraestrutura (seção 8)",
    "concorrencia: teste de condição de corrida com transações reais",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "PT", "RUF", "DTZ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["\\.venv/"]

[[tool.mypy.overrides]]
module = ["environ.*", "procrastinate.*", "allauth.*", "factory.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
branch = true
source = ["apps"]
