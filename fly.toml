# App de homologação (E16-01). Os segredos NÃO ficam aqui: `fly secrets set` (ver
# docs/operacao/homologacao.md). `AMBIENTE=homologacao` com o simulador; o WhatsApp fica desligado.
app = "organicos-meier-homolog"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.prod"
  AMBIENTE = "homologacao"
  PROVEDOR_PAGAMENTOS = "simulador"
  CANAL_WHATSAPP = "desligado"
  TZ = "UTC"

[processes]
  web = "gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --timeout 30"
  worker = "python manage.py procrastinate worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/saude/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "worker"]
